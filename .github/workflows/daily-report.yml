name: Daily Investment Report

on:
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 = Taiwan 08:00
  workflow_dispatch:        # Allow manual trigger for testing

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate dashboard
        id: generate
        run: npm run generate
        continue-on-error: true   # Pipeline failure won't block deploy
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GOOGLE_SHEETS_CSV_URL: ${{ secrets.GOOGLE_SHEETS_CSV_URL }}

      - name: Deploy to Vercel
        if: always()   # Always deploy — even if pipeline failed, push last known good HTML
        run: |
          npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel deploy --prebuilt --prod --no-wait --token=${{ secrets.VERCEL_TOKEN }} || \
          npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} || true
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Commit and push knowledge base
        if: steps.generate.outcome == 'success'   # Only commit when pipeline succeeded
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/index.html
          git add knowledge/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update dashboard $(date +'%Y-%m-%d %H:%M UTC')"
          git push
